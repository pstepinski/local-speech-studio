name: local-speech-studio

services:
  gui:
    image: pstepinski/local-speech-studio-gui:latest
    build:
      context: .
      dockerfile: Dockerfile.gui
    restart: unless-stopped
    environment:
      GUI_TTS_UPSTREAM_URL: ${GUI_TTS_UPSTREAM_URL:-http://tts:8000}
      GUI_STT_UPSTREAM_URL: ${GUI_STT_UPSTREAM_URL:-http://stt:8001}
      GUI_ENABLE_TTS: ${GUI_ENABLE_TTS:-true}
      GUI_ENABLE_STT: ${GUI_ENABLE_STT:-true}
      GUI_ENABLE_CONTINUOUS: ${GUI_ENABLE_CONTINUOUS:-true}
    ports:
      - "${GUI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  tts:
    image: pstepinski/local-speech-studio-tts:latest
    build:
      context: .
      dockerfile: Dockerfile.tts
    restart: unless-stopped
    environment:
      CHATTERBOX_DEVICE: cuda
      CHATTERBOX_VOICE_PROMPT: ${CHATTERBOX_VOICE_PROMPT:-}
      HF_HOME: /models/huggingface
    ports:
      - "${CHATTERBOX_PORT:-8000}:8000"
    volumes:
      - model-cache:/models/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_GPU_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10m

  stt:
    image: pstepinski/local-speech-studio-stt:latest
    build:
      context: .
      dockerfile: Dockerfile.stt
    restart: unless-stopped
    environment:
      WHISPER_DEVICE: cuda:0
      WHISPER_MODEL_ID: ${WHISPER_MODEL_ID:-openai/whisper-large-v3-turbo}
      WHISPER_MAX_UPLOAD_MB: ${WHISPER_MAX_UPLOAD_MB:-100}
      WHISPER_WAKE_PHRASE: ${WHISPER_WAKE_PHRASE:-OK Studio!}
      HF_HOME: /models/huggingface
    ports:
      - "${WHISPER_PORT:-8001}:8001"
    volumes:
      - model-cache:/models/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${STT_GPU_ID:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10m

volumes:
  model-cache:
    name: local-speech-studio-model-cache

